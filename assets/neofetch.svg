<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace">
  <style>
    :root { --bg:#0d1117; --bar:#161b22; --line:#30363d; --fg:#c9d1d9; --dim:#8b949e; --acc:#f5a623; --acc2:#ff6b6b; --ok:#3fb950; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#ffffff; --bar:#f6f8fa; --line:#d0d7de; --fg:#24292f; --dim:#57606a; --acc:#c46a00; --acc2:#cf222e; --ok:#1a7f37; }
    }
    .bg { fill:var(--bg); stroke:var(--line); }
    .bar { fill:var(--bar); }
    .t { fill:var(--fg); font-size:14px; white-space:pre; }
    .k { fill:var(--acc); font-weight:700; }
    .d { fill:var(--dim); }
    .art { fill:var(--acc); font-size:15px; white-space:pre; }
    .p { fill:var(--ok); font-weight:700; }
    .ln { opacity:0; animation: in .35s ease-out forwards; }
    @keyframes in { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:none; } }
    .cur { fill:var(--acc); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { .ln { animation:none; opacity:1; } .cur { animation:none; } }
  </style>

  <!-- window -->
  <rect class="bg" x="0.5" y="0.5" width="859" height="359" rx="12"/>
  <path class="bar" d="M12.5 0.5h835a12 12 0 0 1 12 12v22h-859v-22a12 12 0 0 1 12-12z"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="430" y="22" text-anchor="middle" class="t d" font-size="12">vivansh@github: ~</text>

  <!-- prompt -->
  <text x="24" y="64" class="t ln" style="animation-delay:.1s"><tspan class="p">vivansh@github</tspan><tspan class="d">:~$ </tspan>neofetch</text>

