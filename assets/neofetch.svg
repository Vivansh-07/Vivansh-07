  <g class="ln" style="animation-delay:.4s">
    <text x="24" y="104" class="art">██╗   ██╗ ██████╗ </text>
    <text x="24" y="124" class="art">██║   ██║██╔════╝ </text>
    <text x="24" y="144" class="art">██║   ██║██║  ███╗</text>
    <text x="24" y="164" class="art">╚██╗ ██╔╝██║   ██║</text>
    <text x="24" y="184" class="art"> ╚████╔╝ ╚██████╔╝</text>
    <text x="24" y="204" class="art">  ╚═══╝   ╚═════╝ </text>
  </g>

  <!-- info -->
  <text x="300" y="96"  class="t ln" style="animation-delay:.6s"><tspan class="k">vivansh</tspan><tspan class="d">@</tspan><tspan class="k">garg</tspan></text>
  <text x="300" y="112" class="t d ln" style="animation-delay:.7s">───────────────────────────────────────────</text>
  <text x="300" y="136" class="t ln" style="animation-delay:0.8s"><tspan class="k">Edu      </tspan>B.Tech CSE (Data Science) · MUJ '28</text>
  <text x="300" y="158" class="t ln" style="animation-delay:0.9s"><tspan class="k">Focus    </tspan>Retrieval · Deepfakes · Graphs · Fairness</text>
  <text x="300" y="180" class="t ln" style="animation-delay:1.0s"><tspan class="k">Langs    </tspan>Python · Java · C++ · JavaScript</text>
  <text x="300" y="202" class="t ln" style="animation-delay:1.1s"><tspan class="k">Stack    </tspan>PyTorch · FastAPI · Node · React · Docker</text>
  <text x="300" y="224" class="t ln" style="animation-delay:1.2s"><tspan class="k">Status   </tspan>open to internships · always building</text>
  <text x="300" y="246" class="t ln" style="animation-delay:1.3s"><tspan class="k">Contact  </tspan>vivanshgarg05@gmail.com</text>
  <text x="300" y="268" class="t ln" style="animation-delay:1.4s"><tspan class="k">LinkedIn </tspan>in/vivansh-garg</text>

