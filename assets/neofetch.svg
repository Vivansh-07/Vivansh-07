  <g class="ln" style="animation-delay:1.6s">
    <rect x="300" y="286" width="26" height="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="326" y="286" width="26" height="14" fill="#ff6b6b"/>
    <rect x="352" y="286" width="26" height="14" fill="#3fb950"/>
    <rect x="378" y="286" width="26" height="14" fill="#f5a623"/>
    <rect x="404" y="286" width="26" height="14" fill="#58a6ff"/>
    <rect x="430" y="286" width="26" height="14" fill="#bc8cff"/>
    <rect x="456" y="286" width="26" height="14" fill="#39c5cf"/>
    <rect x="482" y="286" width="26" height="14" fill="#c9d1d9"/>
  </g>

  <!-- next prompt -->
  <text x="24" y="334" class="t ln" style="animation-delay:1.9s"><tspan class="p">vivansh@github</tspan><tspan class="d">:~$ </tspan></text>
  <rect class="cur ln" x="182" y="322" width="9" height="16" style="animation-delay:1.9s"/>
</svg>
